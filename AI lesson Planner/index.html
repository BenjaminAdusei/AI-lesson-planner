<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Lesson Planner for Ghanaian Teachers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f0f9ff 0%, #e6f4f0 100%);
      font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
      padding: 2rem 1.5rem;
      color: #1a2a3f;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Main content panels */
    .two-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: flex-start;
    }

    .form-card {
      flex: 1.2;
      min-width: 320px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(2px);
      border-radius: 48px;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.5);
    }

    .result-card {
      flex: 2;
      min-width: 380px;
      background: #ffffff;
      border-radius: 48px;
      padding: 2rem;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    /* Header */
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero h1 {
      font-size: 2.6rem;
      background: linear-gradient(135deg, #1E3C2C, #D4AF37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #2c5a4f;
      margin-top: 0.6rem;
      font-weight: 500;
    }

    /* Ghana flag accent */
    .flag-bar {
      width: 100px;
      height: 5px;
      background: linear-gradient(90deg, #CE1126 33%, #FCD20F 33%, #FCD20F 66%, #006B3F 66%);
      margin: 1rem auto 0;
      border-radius: 4px;
    }

    /* Form elements */
    label {
      font-weight: 600;
      margin-top: 1.2rem;
      display: block;
      color: #1e3b2f;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      margin-top: 0.5rem;
      border: 1.5px solid #cbdcd0;
      border-radius: 40px;
      font-size: 1rem;
      background: #ffffff;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
    }

    button {
      background: #1e3b2f;
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      margin-top: 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover {
      background: #0f2b21;
      transform: scale(0.98);
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #D4AF37;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Lesson plan output styling */
    .lesson-plan {
      background: #fefcf5;
      border-radius: 32px;
      padding: 1.5rem;
      margin-top: 1rem;
      border-left: 6px solid #D4AF37;
      white-space: pre-wrap;
      font-family: 'Segoe UI', system-ui;
      line-height: 1.5;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border-left-color: #b91c1c;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    hr {
      margin: 1rem 0;
      border: 0;
      height: 2px;
      background: #e2dfcf;
    }

    @media (max-width: 780px) {
      body { padding: 1rem; }
      .form-card, .result-card { border-radius: 32px; }
      .hero h1 { font-size: 2rem; }
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: #4a6a5c;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>📖 AI Lesson Planner</h1>
    <div class="flag-bar"></div>
    <p>WAEC‑aligned lesson plans — generated in seconds, tailored for Ghana</p>
  </div>

  <div class="two-columns">
    <!-- LEFT: INPUT FORM -->
    <div class="form-card">
      <form id="lessonForm">
        <label>📌 Lesson Topic *</label>
        <input type="text" id="topic" placeholder="e.g., Photosynthesis, Electric Circuits, Pronouns" required>

        <label>👩‍🏫 Class / Level *</label>
        <select id="classLevel" required>
          <option value="JHS 1">JHS 1 (Basic 7)</option>
          <option value="JHS 2">JHS 2 (Basic 8)</option>
          <option value="JHS 3">JHS 3 (Basic 9) — BECE candidate</option>
          <option value="SHS 1">Senior High School 1</option>
          <option value="SHS 2">SHS 2</option>
          <option value="SHS 3">SHS 3 — WASSCE candidate</option>
        </select>

        <label>⏱️ Duration</label>
        <select id="duration">
          <option value="40 minutes">40 minutes (single period)</option>
          <option value="60 minutes">60 minutes</option>
          <option value="80 minutes">80 minutes (double period)</option>
        </select>

        <label>📖 Main Subject</label>
        <input type="text" id="subject" placeholder="e.g., Integrated Science, Mathematics, English" value="Integrated Science">

        <label>🔌 Available Resources (optional)</label>
        <input type="text" id="resources" placeholder="e.g., Chalkboard, chart, smartphone, empty tins">

        <button type="submit" id="generateBtn">
          ✨ Generate WAEC Lesson Plan
        </button>
      </form>
    </div>

    <!-- RIGHT: RESULT AREA -->
    <div class="result-card">
      <h2>📝 Lesson Plan</h2>
      <div id="planOutput" class="lesson-plan" style="min-height: 320px;">
        <p style="color: #999; text-align: center; margin-top: 3rem;">Your WAEC-style lesson plan will appear here ✨</p>
      </div>
    </div>
  </div>
  <footer>
    🇬🇭 AI Lesson Planner for Ghanaian Teachers – works offline after install | Powered by Groq
  </footer>
</div>

<script>
  const form = document.getElementById('lessonForm');
  const generateBtn = document.getElementById('generateBtn');
  const planOutput = document.getElementById('planOutput');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const topic = document.getElementById('topic').value.trim();
    const classLevel = document.getElementById('classLevel').value;
    const duration = document.getElementById('duration').value;
    const subject = document.getElementById('subject').value.trim();
    const resources = document.getElementById('resources').value.trim();

    if (!topic) {
      planOutput.innerHTML = `<div class="lesson-plan error">❌ Please enter a lesson topic.</div>`;
      return;
    }

    // Show loading state
    generateBtn.disabled = true;
    generateBtn.innerHTML = `<span class="spinner"></span> Generating...`;

    planOutput.innerHTML = `<div class="lesson-plan" style="text-align:center">⏳ Contacting AI lesson designer ...</div>`;

    try {
      const response = await fetch('/.netlify/functions/generate-lesson', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, classLevel, duration, subject, resources })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Failed to generate lesson plan');
      }

      // Beautify the output (keep markdown line breaks)
      let formattedPlan = data.lessonPlan;
      // convert URL links if any
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      formattedPlan = formattedPlan.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      // preserve line breaks
      formattedPlan = formattedPlan.replace(/\n/g, '<br>');

      planOutput.innerHTML = `<div class="lesson-plan">${formattedPlan}</div>`;
    } catch (err) {
      console.error(err);
      planOutput.innerHTML = `<div class="lesson-plan error">⚠️ Error: ${err.message}. Please try again later.</div>`;
    } finally {
      generateBtn.disabled = false;
      generateBtn.innerHTML = `✨ Generate WAEC Lesson Plan`;
    }
  });
</script>
</body>
</html>
